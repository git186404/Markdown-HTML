<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 查询 | GitHub版</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
        }
        #main-ip {
            font-size: 2em;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .loading {
            color: #888;
        }
        #refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #refresh-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IP 查询</h1>
        <div id="main-ip">正在获取IP...</div>
        <table id="ip-table">
            <tr>
                <th>IP</th>
                <th>运营商</th>
                <th>地址</th>
            </tr>
        </table>
        <button id="refresh-btn">刷新数据</button>
    </div>

    <script>
        const API_ENDPOINTS = [
            { url: 'https://api.ipify.org?format=json', name: 'IPify' },
            { url: 'https://ipapi.co/json/', name: 'IPAPI.co' },
            { url: 'https://ipinfo.io/json', name: 'IPInfo.io' }
        ];

        async function fetchWithTimeout(url, timeout = 5000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        function updateTable(data, source) {
            const table = document.getElementById('ip-table');
            const row = table.insertRow(-1);
            const ip = data.ip || data.query || '未知';
            row.insertCell(0).textContent = ip;
            row.insertCell(1).textContent = data.org || data.as || data.isp || '未知';
            row.insertCell(2).textContent = `${data.city || ''}, ${data.region || ''}, ${data.country || ''}`;
            row.dataset.source = source;
            return ip;
        }

        async function getIPInfo() {
            const table = document.getElementById('ip-table');
            const mainIP = document.getElementById('main-ip');
            
            mainIP.textContent = '正在获取IP...';
            
            // 显示加载状态
            table.innerHTML = '<tr><th>IP</th><th>运营商</th><th>地址</th></tr>';
            
            // 先显示缓存数据
            loadCachedData();
            
            let firstValidIP = null;

            for (let endpoint of API_ENDPOINTS) {
                try {
                    const response = await fetchWithTimeout(endpoint.url);
                    const data = await response.json();
                    
                    // 保存到localStorage
                    localStorage.setItem('ipInfo', JSON.stringify(data));
                    
                    const ip = updateTable(data, endpoint.name);
                    if (!firstValidIP) {
                        firstValidIP = ip;
                    }
                } catch (error) {
                    console.error('Error fetching from', endpoint.url, ':', error);
                    const row = table.insertRow(-1);
                    row.insertCell(0).textContent = '获取失败';
                    row.insertCell(1).textContent = '获取失败';
                    row.insertCell(2).textContent = '获取失败';
                    row.dataset.source = endpoint.name;
                }
            }
            
            if (firstValidIP) {
                mainIP.textContent = firstValidIP;
            } else {
                mainIP.textContent = '获取失败';
            }
        }

        function loadCachedData() {
            const cachedData = localStorage.getItem('ipInfo');
            if (cachedData) {
                try {
                    const data = JSON.parse(cachedData);
                    const mainIP = document.getElementById('main-ip');
                    if (!mainIP.textContent || mainIP.textContent === '正在获取IP...') {
                        mainIP.textContent = data.ip || data.query || '未知';
                    }
                    updateTable(data, '缓存');
                } catch (e) {
                    console.error('Error parsing cached data:', e);
                }
            }
        }

        document.getElementById('refresh-btn').addEventListener('click', getIPInfo);

        // 首先加载缓存数据，然后获取新数据
        loadCachedData();
        getIPInfo();
    </script>
</body>
</html>
