<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 与 HTML 转换器</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/2.0.3/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.1/turndown.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #e0e7ff;
      --secondary: #f1f5f9;
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.2s ease;
    }

    .dark {
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --primary-light: #312e81;
      --secondary: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -4px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: var(--transition);
      line-height: 1.6;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--secondary);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .icon-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
    }

    .tabs-container {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .tab {
      padding: 12px 20px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: -1px;
      border-bottom: 2px solid transparent;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--primary-light);
    }

    .tab svg {
      width: 16px;
      height: 16px;
    }

    .main {
      flex: 1;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-view {
      display: none;
      height: calc(100vh - 130px);
    }

    .tab-view.active {
      display: flex;
      flex-direction: column;
    }

    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .panel-actions {
      display: flex;
      gap: 6px;
    }

    .panel-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 16px;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      resize: none;
      transition: var(--transition);
    }

    textarea:focus {
      outline: none;
      background: var(--secondary);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .preview {
      flex: 1;
      padding: 16px;
      overflow: auto;
      background: var(--bg);
    }

    .preview-content {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 16px;
      min-height: 100%;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .preview-content h1, .preview-content h2, .preview-content h3 {
      margin-top: 0;
      color: var(--text);
    }

    .preview-content p {
      color: var(--text-secondary);
    }

    .preview-content code {
      background: var(--secondary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .preview-content pre {
      background: var(--secondary);
      padding: 12px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
    }

    .preview-content pre code {
      background: none;
      padding: 0;
    }

    .preview-content blockquote {
      border-left: 3px solid var(--primary);
      padding-left: 12px;
      margin: 12px 0;
      color: var(--text-secondary);
    }

    .preview-content ul, .preview-content ol {
      padding-left: 20px;
      color: var(--text-secondary);
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-icon {
      padding: 6px;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 4px;
    }

    .btn-icon:hover {
      background: var(--secondary);
      color: var(--text);
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
    }

    .toolbar {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      flex-shrink: 0;
      gap: 12px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .status {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--secondary);
      border-radius: 12px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status.success .status-dot { background: #22c55e; }
    .status.error .status-dot { background: #ef4444; }
    .status.loading .status-dot {
      background: var(--primary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .word-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .quill-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .ql-toolbar {
      border: none !important;
      border-bottom: 1px solid var(--border) !important;
      background: var(--secondary);
      padding: 8px 12px !important;
    }

    .ql-container {
      border: none !important;
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    .ql-editor {
      padding: 16px !important;
      color: var(--text);
    }

    .ql-editor.ql-blank::before {
      color: var(--text-muted);
      font-style: normal;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 16px;
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1001;
      font-size: 14px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success { border-left: 3px solid #22c55e; }
    .toast.error { border-left: 3px solid #ef4444; }

    .toast svg {
      width: 18px;
      height: 18px;
    }

    .toast.success svg { color: #22c55e; }
    .toast.error svg { color: #ef4444; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 14px;
      max-width: 300px;
    }

    .output-type {
      font-size: 12px;
      color: var(--text-muted);
      padding: 2px 8px;
      background: var(--secondary);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .app { padding-bottom: 60px; }

      header { padding: 10px 16px; }

      .logo h1 { display: none; }

      .tabs-container { padding: 0 12px; overflow-x: auto; }

      .tab { padding: 10px 14px; font-size: 13px; white-space: nowrap; }

      .tab span { display: none; }

      .main { padding: 12px; }

      .editor-container {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .panel { min-height: 250px; }

      .toolbar {
        flex-wrap: wrap;
        padding: 8px 12px;
      }

      .hint { display: none; }

      .btn span { display: none; }

      .btn { padding: 8px; }
    }

    @media (max-width: 480px) {
      .panel-header { padding: 10px 12px; }

      textarea { padding: 12px; font-size: 12px; }

      .preview { padding: 12px; }

      .preview-content { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <div class="logo-icon">M</div>
        <h1>转换器</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="toggleTheme" title="切换主题">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="moon-icon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="tabs-container">
      <div class="tabs">
        <button class="tab active" data-tab="code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          <span>代码转换</span>
        </button>
        <button class="tab" data-tab="write">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          <span>富文本编辑</span>
        </button>
      </div>
    </div>

    <main class="main">
      <div id="codeView" class="tab-view active">
        <div class="editor-container">
          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                输入
              </span>
              <div class="panel-actions">
                <button class="btn-icon" onclick="App.clearInput()" title="清空">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="panel-body">
              <textarea id="input" placeholder="输入 Markdown 或 HTML 代码..."></textarea>
            </div>
            <div class="toolbar">
              <div class="toolbar-left">
                <span class="word-count" id="inputCount">0 字符</span>
              </div>
              <div class="toolbar-right">
                <button class="btn btn-secondary" onclick="App.convertToMarkdown()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                  </svg>
                  <span>HTML 转 Markdown</span>
                </button>
                <button class="btn btn-primary" onclick="App.convertToHTML()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="8 6 2 12 8 18"/>
                    <polyline points="16 18 22 12 16 6"/>
                  </svg>
                  <span>Markdown 转 HTML</span>
                </button>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <span class="panel-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="16 18 22 12 16 6"/>
                  <polyline points="8 6 2 12 8 18"/>
                </svg>
                预览
              </span>
              <div class="panel-actions">
                <button class="btn-icon" onclick="App.copyPreview()" title="复制预览">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="panel-body">
              <div class="preview">
                <div class="preview-content" id="preview">
                  <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                      <line x1="3" y1="9" x2="21" y2="9"/>
                      <line x1="9" y1="21" x2="9" y2="9"/>
                    </svg>
                    <p>输入内容后将显示预览</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="toolbar">
              <div class="toolbar-left">
                <span class="status" id="status">
                  <span class="status-dot"></span>
                  <span id="statusText">就绪</span>
                </span>
              </div>
              <div class="toolbar-right">
                <span class="output-type" id="outputType" style="font-size:12px;color:var(--text-muted);margin-right:8px;"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="panel" style="margin-top:16px">
          <div class="panel-header">
            <span class="panel-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
              <span id="outputTitle">转换结果</span>
            </span>
            <div class="panel-actions">
              <button class="btn-icon" onclick="App.copyResult()" title="复制结果">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="panel-body">
            <textarea id="output" readonly placeholder="转换结果将显示在这里..."></textarea>
          </div>
        </div>
      </div>

      <div id="writeView" class="tab-view">
        <div class="panel" style="flex:1">
          <div class="panel-header">
            <span class="panel-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              富文本编辑器
            </span>
            <div class="panel-actions">
              <button class="btn btn-secondary" onclick="App.exportMarkdown()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                </svg>
                <span>Markdown</span>
              </button>
              <button class="btn btn-primary" onclick="App.exportHTML()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="16 18 22 12 16 6"/>
                  <polyline points="8 6 2 12 8 18"/>
                </svg>
                <span>HTML</span>
              </button>
            </div>
          </div>
          <div class="quill-wrapper">
            <div id="editor"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span id="toastMessage">操作成功</span>
  </div>

  <script>
    const App = {
      quill: null,
      turndownService: null,
      debounceTimer: null,

      init() {
        this.turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
        this.bindEvents();
        this.loadTheme();
      },

      bindEvents() {
        document.querySelectorAll('.tab').forEach(tab => {
          tab.addEventListener('click', () => this.switchTab(tab.dataset.tab));
        });

        const input = document.getElementById('input');
        if (input) {
          input.addEventListener('input', () => {
            this.updateCharCount();
            this.handleAutoConvert();
          });
        }

        document.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            this.handleAutoConvert();
          }
        });

        document.getElementById('toggleTheme')?.addEventListener('click', () => this.toggleTheme());
      },

      switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
        
        document.querySelector(`.tab[data-tab="${tabName}"]`)?.classList.add('active');
        document.getElementById(tabName + 'View')?.classList.add('active');

        if (tabName === 'write' && !this.quill) {
          setTimeout(() => this.initQuill(), 100);
        }
      },

      initQuill() {
        if (this.quill) return;
        this.quill = new Quill('#editor', {
          theme: 'snow',
          placeholder: '在此撰写内容...',
          modules: {
            toolbar: [
              [{ 'header': [1, 2, 3, false] }],
              ['bold', 'italic', 'underline', 'strike'],
              [{ 'color': [] }, { 'background': [] }],
              [{ 'list': 'ordered'}, { 'list': 'bullet' }],
              ['blockquote', 'code-block'],
              ['link', 'image'],
              ['clean']
            ]
          }
        });
      },

      handleAutoConvert() {
        const input = document.getElementById('input');
        if (!input) return;

        clearTimeout(this.debounceTimer);
        this.debounceTimer = setTimeout(() => {
          const value = input.value.trim();
          if (!value) {
            this.clearPreview();
            return;
          }
          value.startsWith('<') ? this.convertToMarkdown() : this.convertToHTML();
        }, 300);
      },

      convertToHTML() {
        const input = document.getElementById('input');
        const preview = document.getElementById('preview');
        const output = document.getElementById('output');
        const outputTitle = document.getElementById('outputTitle');
        const outputType = document.getElementById('outputType');
        
        if (!input?.value.trim()) { this.clearPreview(); return; }

        this.setStatus('转换中...', 'loading');
        setTimeout(() => {
          try {
            const result = marked(input.value);
            preview.innerHTML = result;
            if (output) {
              output.value = result;
              output.style.display = 'block';
            }
            if (outputTitle) outputTitle.textContent = 'HTML 输出';
            if (outputType) outputType.textContent = 'HTML';
            this.setStatus('转换完成', 'success');
          } catch (e) {
            this.setStatus('转换失败', 'error');
            this.showToast('转换失败，请检查输入格式', 'error');
          }
        }, 50);
      },

      convertToMarkdown() {
        const input = document.getElementById('input');
        const preview = document.getElementById('preview');
        const output = document.getElementById('output');
        const outputTitle = document.getElementById('outputTitle');
        const outputType = document.getElementById('outputType');
        
        if (!input?.value.trim()) { this.clearPreview(); return; }

        this.setStatus('转换中...', 'loading');
        setTimeout(() => {
          try {
            const result = this.turndownService.turndown(input.value);
            preview.innerHTML = input.value;
            if (output) {
              output.value = result;
              output.style.display = 'block';
            }
            if (outputTitle) outputTitle.textContent = 'Markdown 输出';
            if (outputType) outputType.textContent = 'Markdown';
            this.setStatus('转换完成', 'success');
          } catch (e) {
            this.setStatus('转换失败', 'error');
            this.showToast('转换失败，请检查输入格式', 'error');
          }
        }, 50);
      },

      clearInput() {
        const input = document.getElementById('input');
        if (input) { input.value = ''; this.updateCharCount(); }
        this.clearPreview();
      },

      clearPreview() {
        const preview = document.getElementById('preview');
        const output = document.getElementById('output');
        const outputTitle = document.getElementById('outputTitle');
        const outputType = document.getElementById('outputType');
        
        if (preview) {
          preview.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg><p>输入内容后将显示预览</p></div>`;
        }
        if (output) output.value = '';
        if (outputTitle) outputTitle.textContent = '转换结果';
        if (outputType) outputType.textContent = '';
        this.setStatus('就绪', '');
      },

      copyPreview() {
        const preview = document.getElementById('preview');
        if (!preview?.innerHTML || preview.querySelector('.empty-state')) {
          this.showToast('没有可复制的内容', 'error');
          return;
        }
        this.copyToClipboard(preview.innerHTML, 'HTML 预览');
      },

      copyResult() {
        const output = document.getElementById('output');
        const outputType = document.getElementById('outputType');
        if (!output?.value) {
          this.showToast('没有可复制的结果', 'error');
          return;
        }
        const type = outputType?.textContent || '结果';
        this.copyToClipboard(output.value, type);
      },

      exportMarkdown() {
        if (!this.quill) { this.showToast('编辑器未初始化', 'error'); return; }
        const markdown = this.turndownService.turndown(this.quill.root.innerHTML);
        navigator.clipboard.writeText(markdown).then(() => {
          this.showToast('Markdown 已复制');
        }).catch(() => {
          this.showToast('复制失败', 'error');
        });
      },

      exportHTML() {
        if (!this.quill) { this.showToast('编辑器未初始化', 'error'); return; }
        const html = this.quill.root.innerHTML;
        navigator.clipboard.writeText(html).then(() => {
          this.showToast('HTML 已复制');
        }).catch(() => {
          this.showToast('复制失败', 'error');
        });
      },

      copyToClipboard(text, label) {
        navigator.clipboard.writeText(text).then(() => {
          this.showToast(`${label}已复制`);
        }).catch(() => {
          this.showToast('复制失败', 'error');
        });
      },

      updateCharCount() {
        const count = document.getElementById('inputCount');
        if (count) count.textContent = `${document.getElementById('input')?.value.length || 0} 字符`;
      },

      setStatus(message, type) {
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        if (status) { status.className = 'status ' + type; if (statusText) statusText.textContent = message; }
      },

      showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toastMessage');
        if (toast && msg) { msg.textContent = message; toast.className = 'toast ' + type; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
      },

      toggleTheme() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        this.updateThemeIcon(isDark);
      },

      loadTheme() {
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark');
          this.updateThemeIcon(true);
        }
      },

      updateThemeIcon(isDark) {
        const sun = document.querySelector('.sun-icon');
        const moon = document.querySelector('.moon-icon');
        if (sun && moon) { sun.style.display = isDark ? 'none' : 'block'; moon.style.display = isDark ? 'block' : 'none'; }
      }
    };

    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
